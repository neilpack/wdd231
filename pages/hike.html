<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Explore fictional hiking trails throughout Neil Land."
  >

  <title>Neil Land Hiking Guide</title>

  <link rel="stylesheet" href="../styles/hike.css">
  <script src="../scripts/hike.js" defer></script>
</head>

<body>

  <header class="site-header">
    <div class="header-content">
      <h1>Neil Land Hiking Guide</h1>
      <p>Discover trails across the wild lands of Neil Land.</p>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="hikes-heading">
      <h2 id="hikes-heading">Explore the Trails</h2>
      <p>
        Find your next adventure. From peaceful forest walks
        to difficult mountain climbs, Neil Land has a trail for everyone.
      </p>
    </section>

    <section
      id="hike-list"
      class="hike-grid"
      aria-label="Hiking trails"
    >
      <!-- Hiking cards are generated with JavaScript -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Neil Land Hiking Guide</p>
    <p>All locations and hikes are fictional.</p>
  </footer>

</body>
</html>
